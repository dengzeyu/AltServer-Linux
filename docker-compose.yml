version: '3.8'

services:
  altserver:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
      args:
        - BUILDPLATFORM=linux/amd64
        - TARGETARCH=amd64
    image: altserver-linux:latest
    container_name: altserver
    restart: unless-stopped

    # Network configuration for device discovery
    network_mode: host

    # Environment variables
    environment:
      - ALTSERVER_ANISETTE_SERVER=${ANISETTE_SERVER:-https://armconverter.com/anisette/irGb3Quww8zrhgqnzmrx}
      - ALTSERVER_NO_SUBSCRIBE=${NO_SUBSCRIBE:-0}
      - TZ=${TZ:-UTC}
      - ALTSERVER_DEBUG=${DEBUG:-0}

    # Data persistence
    volumes:
      - altserver_data:/app/data
      - altserver_logs:/app/logs

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "AltServer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional self-hosted anisette server (disabled by default)
  anisette-server:
    image: dadoum/anisette-v3-server:latest
    container_name: altserver-anisette
    restart: unless-stopped
    profiles:
      - anisette  # Enable with: docker-compose --profile anisette up

    environment:
      - ANISETTE_SERVER_PORT=8080
      - TZ=${TZ:-UTC}
      - ANISETTE_DEBUG=${DEBUG:-0}
      - ANISETTE_LOG_LEVEL=${DEBUG:-info}

    ports:
      - "8080:8080/tcp"

    # Custom network for anisette communication
    networks:
      - altserver-net

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    # Data persistence for anisette server
    volumes:
      - anisette_data:/data

# Network configuration
networks:
  altserver-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    labels:
      - "altserver.network=internal"

# Volume configuration
volumes:
  altserver_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data
    labels:
      - "altserver.volume=data"

  altserver_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/logs
    labels:
      - "altserver.volume=logs"

  anisette_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/anisette-data
    labels:
      - "altserver.volume=anisette-data"